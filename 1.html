<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #F3EEE4;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-container {
      width: 1080px;
      height: 1080px;

      /* Makes it responsive on smaller screens */
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 1 / 1;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>

<body>

  <div class="video-container">
    <video autoplay muted loop playsinline>
      <source src="video.mp4" type="video/mp4">
      Your browser does not support video.
    </video>
  </div>

</body>
</html>

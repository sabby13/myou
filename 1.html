<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Memory of You</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #111111;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    /* Square video canvas */
    .video-container {
      width: min(90vw, 90vh);
      height: min(90vw, 90vh);

      aspect-ratio: 1 / 1;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;

      object-fit: contain;

      display: block;
    }
  </style>
</head>

<body>

  <div class="video-container">
    <video autoplay muted loop playsinline>
      <source src="video.mp4" type="video/mp4">
    </video>
  </div>

</body>
</html>
